<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2b6cb0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5282;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Fondo redondeado suave -->
  <rect width="512" height="512" rx="100" fill="url(#grad)" />
  <!-- Asa de la Kettlebell -->
  <path d="M170 240 C170 120, 342 120, 342 240" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
  <!-- Cuerpo de la Kettlebell / Esfera de Reloj -->
  <circle cx="256" cy="310" r="110" fill="#ffffff" />
  <!-- Manecillas del Reloj internos (Control de tiempo/turnos) -->
  <path d="M256 310 L256 245 M256 310 L310 310" fill="none" stroke="#2b6cb0" stroke-width="16" stroke-linecap="round" />
  <!-- Centro del reloj -->
  <circle cx="256" cy="310" r="10" fill="#dd6b20" />
</svg>
