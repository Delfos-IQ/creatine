<!doctype html>
<html lang="es" data-lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2b6cb0" />
  <title>CronoFuerza MTN</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="app-header">
      <img src="logo.svg" alt="Logo" class="app-logo" />
      <div>
        <h1 id="app-title">CronoFuerza MTN</h1>
        <p id="app-subtitle">Control de Glucemia, Estrés e Hipertrofia</p>
      </div>
    </header>

    <section class="toolbar" aria-label="Idioma">
      <button class="lang-btn active" data-lang="es">ES</button>
      <button class="lang-btn" data-lang="pt">PT</button>
    </section>

    <nav class="nav-tabs" aria-label="Secciones">
      <button class="tab-btn active" data-tab="diario">Diario</button>
      <button class="tab-btn" data-tab="kb">Kettlebell</button>
      <button class="tab-btn" data-tab="water">Agua</button>
      <button class="tab-btn" data-tab="macros">Nutrición</button>
      <button class="tab-btn" data-tab="stats">Historial</button>
    </nav>

    <section id="sec-diario" class="app-section"></section>
    <section id="sec-kb" class="app-section hidden"></section>
    <section id="sec-water" class="app-section hidden"></section>
    <section id="sec-macros" class="app-section hidden"></section>
    <section id="sec-stats" class="app-section hidden"></section>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
