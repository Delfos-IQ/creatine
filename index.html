<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronoBienestar Total: Fuerza y Control de Insulina</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --primary: #2b6cb0;
            --accent: #dd6b20;
            --kettlebell: #2c5282;
            --vitd: #b7791f;
            --glucose: #9b2c2c;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 460px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        h1 { text-align: center; font-size: 21px; margin-bottom: 5px; color: #1a202c; }
        h2 { text-align: center; font-size: 13px; color: #718096; font-weight: normal; margin-top: 0; margin-bottom: 20px; }
        
        .box-question {
            background: #edf2f7;
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        label { font-weight: bold; display: block; margin-bottom: 6px; font-size: 14px; }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #fff;
            margin-bottom: 5px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }
        button:hover { background-color: #234e7a; }
        
        .output-box {
            margin-top: 20px;
            display: none;
        }
        .section-title {
            font-size: 15px;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 2px solid var(--border);
            color: var(--primary);
        }
        .kb-section { color: var(--kettlebell); border-bottom: 2px solid #bee3f8; }
        .vitd-section { color: var(--vitd); border-bottom: 2px solid #feebc8; }
        .glucose-section { color: var(--glucose); border-bottom: 2px solid #fed7d7; }
        ul { padding-left: 18px; margin: 0; }
        li { margin-bottom: 10px; line-height: 1.4; font-size: 14px; }
        .study-note {
            font-size: 11px;
            color: #718096;
            font-style: italic;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⏱️ Planificador Metabólico MTN</h1>
    <h2>46 años | Control de Glucemia, Estrés e Hipertrofia</h2>

    <!-- FORMULARIO INTERACTIVO -->
    <div class="box-question">
        <label for="turnoSelect">💼 ¿Qué jornada laboral tienes hoy o vienes de realizar?</label>
        <select id="turnoSelect">
            <option value="M">Turno M (Mañana sola)</option>
            <option value="T">Turno T (Tarde sola)</option>
            <option value="N">Saliente de Turno N (Noche)</option>
            <option value="MT">Doblando Turno (M + T)</option>
            <option value="TN">Doblando Turno (T + N)</option>
            <option value="24H">Saliente de Guardia de 24 Horas</option>
            <option value="LIBRE">Día Libre / Descanso Puro</option>
        </select>
    </div>

    <div class="box-question">
        <label for="familiaSelect">🧒 ¿Cuál es la situación con tus hijos hoy?</label>
        <select id="familiaSelect">
            <option value="APOYO">Tengo apoyo (Esposa en casa / Niños en escuela)</option>
            <option value="SOLO_COLE">Solo con peques, pero van a la escuela/extraescolares</option>
            <option value="SOLO_CASA">Solo con peques atrapados en casa (No duermo / Logística total)</option>
        </select>
    </div>

    <button onclick="generarPlanCompleto()">⚡ Calcular mi Plan de Hoy</button>

    <!-- ZONA DE SALIDA -->
    <div id="output" class="output-box">
        <div id="dinamicoContenido"></div>
    </div>
</div>

<script>
    function generarPlanCompleto() {
        const turno = document.getElementById('turnoSelect').value;
        const familia = document.getElementById('familiaSelect').value;
        const output = document.getElementById('output');
        const contenedor = document.getElementById('dinamicoContenido');
        
        let html = `<h2>📋 Tu Estrategia Anti-Cortisol y de Glucemia</h2>`;
        
        // ---- 1. MÓDULO DE CONTROL DE GLUCEMIA Y REORDENACIÓN DE DESAYUNO ----
        html += `<div class="section-title glucose-section">🩸 Optimización de tus Desayunos Reales (Post-Turno/Guardia)</div><ul>`;
        if (turno === "N" || turno === "24H" || turno === "TN") {
            html += `<li>🥪 <strong>Si eliges el Bocadillo (Opción 1):</strong> ¡Excelente la proteína de la tortilla, caballa o sardinas! Para bajar la barriga de estrés, reduce el pan de 80g a unos 40-50g (preferiblemente integral o de masa madre). 
                <br>• <em>Regla de Oro:</em> Dale un mordisco a la tortilla/pescado antes de morder el pan. La proteína en el estómago reduce drásticamente el pico de azúcar en sangre que causa el pan blanco.</li>`;
            html += `<li>🥛 <strong>Si eliges las Gachas/Batido (Opción 2):</strong> La harina de avena líquida junto con la bebida de avena eleva la glucosa muy rápido antes de dormir. 
                <br>• <em>Mejora:</em> Cambia la bebida de avena por bebida de almendras sin azúcar (apenas tiene carbohidratos) o agua, y dobla la cantidad de clara de huevo en polvo para aumentar la saciedad y proteger tus músculos.</li>`;
            html += `<li>⚠️ <strong>El peligro de la Bebida de Avena:</strong> La bebida de avena comercial es, esencialmente, almidón licuado con un índice glucémico muy alto. Al salir de la guardia tu cuerpo es resistente a la insulina; cambiarla por leche entera, bebida de soja sin azúcar o bebida de almendras reducirá drásticamente el almacenamiento de grasa abdominal mientras duermes.</li>`;
        } else {
            html += `<li>🥗 <strong>Estructura Normal:</strong> Mantén tus comidas ordenadas. Prioriza grasas y proteínas en el desayuno para no tener picos de fatiga a media tarde.</li>`;
        }
        html += `</ul>`;

        // ---- 2. SUPLEMENTACIÓN VITAMINA D ----
        html += `<div class="section-title vitd-section">☀️ Protocolo Vitamina D (Masa Muscular y Longevidad)</div><ul>`;
        html += `<li>💊 <strong>Suplementación:</strong> Incorpora Vitamina D3 según prescripción profesional. 
            <br>• <em>Momento Clave:</em> Tómala con tu desayuno de pescados grasos (caballa o sardinas en conserva). Al ser un suplemento liposoluble, las grasas saludables de estos pescados multiplican su absorción.</li>`;
        html += `</ul>`;

        // ---- 3. SUPLEMENTACIÓN CREATINA ----
        html += `<div class="section-title">🧠 Suplementación (Creatina Monohidrato)</div><ul>`;
        html += `<li>🥛 <strong>Uso diario:</strong> Consume creatina para mantener los depósitos celulares saturados.</li>`;
        if (turno === "N" || turno === "TN" || turno === "24H") {
            html += `<li>🧠 <strong>Estrategia de Noche:</strong> Considera su uso en la cena para apoyar la función cognitiva durante la falta de sueño.</li>`;
        }
        html += `</ul>`;

        // ---- 4. ENTRENAMIENTO DE FUERZA (10-15 MINUTOS) ----
        html += `<div class="section-title kb-section">🏋️ Tu Estímulo Kettlebell en Casa (12kg)</div><ul>`;
        if (turno === "24H" || turno === "MT" || (turno === "N" && familia === "SOLO_CASA")) {
            html += `<li><strong>Rutina Corta de Vaciado de Glucógeno:</strong> Estás muy cansado. Mover tus músculos actúa como una esponja que absorbe el azúcar en sangre. Haz esto en cualquier ventana libre de 10 minutos:
                <br>• <strong>Kettlebell Swings (Balanceos):</strong> 3 series x 15 repeticiones (explosivo).
                <br>• <strong>Zancadas (Lunges) sujetando la pesa:</strong> 3 series x 8 por pierna.</li>`;
        } else {
            html += `<li><strong>Rutina Completa de Hipertrofia (Cerca del Fallo):</strong> Tienes energía disponible. Ejecuta con máxima tensión mecánica para romper fibras y ganar músculo:
                <br>• <strong>Kettlebell Swings (Balanceos):</strong> 4 series x 12 repeticiones.
                <br>• <strong>Sentadilla Goblet Profunda:</strong> 4 series x 10 repeticiones.
                <br>• <strong>Remo a una mano en silla:</strong> 4 series x 10 repeticiones por lado.</li>`;
        }
        html += `</ul>`;

        // ---- 5. SUEÑO Y HÁBITOS FAMILIARES ----
        html += `<div class="section-title">🌿 Logística y Descanso Realista</div><ul>`;
        if (familia === "SOLO_CASA" || familia === "SOLO_COLE") {
            html += `<li>☀️ <strong>Paseo de Luz Solar:</strong> Camina a pie a por los niños. La luz detiene la melatonina e incrementa la dopamina, reduciendo los antojos azucarados de la tarde.</li>`;
            html += `<li>🧘 <strong>Meditación Cortisol (3 min):</strong> Respiración cuadrada en el coche. Bajar el estrés disminuye directamente la acumulación de grasa en el abdomen.</li>`;
        } else {
            html += `<li>☀️ <strong>Sol Directo:</strong> Pasea 20 minutos individuales bajo el sol.</li>`;
            html += `<li>🧘 <strong>Meditación Formal (10 min):</strong> Práctica en un lugar silencioso de tu casa.</li>`;
        }
        html += `</ul>`;

        contenedor.innerHTML = html;
        output.style.display = "block";
    }
</script>

</body>
</html>
