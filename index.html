<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronoBienestar: Fuerza y Conciliación</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --primary: #2b6cb0;
            --accent: #dd6b20;
            --kettlebell: #2c5282;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 460px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        h1 { text-align: center; font-size: 22px; margin-bottom: 5px; color: #1a202c; }
        h2 { text-align: center; font-size: 13px; color: #718096; font-weight: normal; margin-top: 0; margin-bottom: 20px; }
        
        .box-question {
            background: #edf2f7;
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        label { font-weight: bold; display: block; margin-bottom: 6px; font-size: 14px; }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #fff;
            margin-bottom: 5px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }
        button:hover { background-color: #2b6cb0; }
        
        .output-box {
            margin-top: 20px;
            display: none;
        }
        .section-title {
            font-size: 15px;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 2px solid var(--border);
            color: var(--primary);
        }
        .kb-section { color: var(--kettlebell); border-bottom: 2px solid #bee3f8; }
        ul { padding-left: 18px; margin: 0; }
        li { margin-bottom: 10px; line-height: 1.4; font-size: 14px; }
        .study-note {
            font-size: 11px;
            color: #718096;
            font-style: italic;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⏱️ Planificador de Fuerza Real</h1>
    <h2>46 años | 75.5 kg | Objetivo: Hipertrofia y Longevidad</h2>

    <!-- FORMULARIO INTERACTIVO -->
    <div class="box-question">
        <label for="turnoSelect">💼 ¿Qué jornada laboral tienes hoy?</label>
        <select id="turnoSelect">
            <option value="M">Turno M (Mañana sola)</option>
            <option value="T">Turno T (Tarde sola)</option>
            <option value="N">Turno N (Noche sola)</option>
            <option value="MT">Doblando Turno (M + T)</option>
            <option value="TN">Doblando Turno (T + N)</option>
            <option value="24H">Guardia Extrema de 24 Horas</option>
            <option value="LIBRE">Día Libre / Descanso</option>
        </select>
    </div>

    <div class="box-question">
        <label for="familiaSelect">🧒 ¿Cuál es la situación con tus hijos hoy?</label>
        <select id="familiaSelect">
            <option value="APOYO">Tengo apoyo (Esposa en casa / Niños en escuela)</option>
            <option value="SOLO_COLE">Solo con peques, pero van a la escuela/extraescolares</option>
            <option value="SOLO_CASA">Solo con peques atrapados en casa (No duermo / Logística total)</option>
        </select>
    </div>

    <button onclick="generarPlanPersonalizado()">⚡ Calcular mi Plan de Hoy</button>

    <!-- ZONA DE SALIDA -->
    <div id="output" class="output-box">
        <div id="dinamicoContenido"></div>
    </div>
</div>

<script>
    function generarPlanPersonalizado() {
        const turno = document.getElementById('turnoSelect').value;
        const familia = document.getElementById('familiaSelect').value;
        const output = document.getElementById('output');
        const contenedor = document.getElementById('dinamicoContenido');
        
        let html = `<h2>📋 Tu Estrategia Optimizada para Hoy</h2>`;
        
        // ---- 1. LÓGICA DE SUEÑO Y SIESTAS ----
        html += `<div class="section-title">😴 Gestión del Sueño Realista</div><ul>`;
        if (turno === "N" && familia === "SOLO_CASA") {
            html += `<li>⚠️ <strong>Alerta Biológica:</strong> Al estar solo con los niños y no poder dormir siesta por la tarde, tu deuda de sueño nocturna será alta. Pon el foco en resistir de forma segura. No fuerces micro-siestas si comprometen la supervisión de los niños.</li>`;
        } else if (turno === "N" && familia === "SOLO_COLE") {
            html += `<li>💤 <strong>Siesta de Emergencia:</strong> Aprovecha el bloque de las 15:30h (cuando aún están bajo logística externa o haciendo deberes) para una siesta corta de 20-30 minutos en el sofá.</li>`;
        } else if (turno === "N" && familia === "APOYO") {
            html += `<li>💤 <strong>Siesta Profiláctica Completa:</strong> Tienes apoyo. Duerme un ciclo completo de 90 minutos por la tarde antes de entrar. Descarga la adenosina acumulada.</li>`;
        } else if (turno === "24H") {
            html += `<li>🚨 <strong>Guardia de 24h:</strong> Si el servicio lo permite, acumula siestas de exactamente 20 minutos durante la noche. Evitas la inercia del sueño profundo.</li>`;
        } else if (turno === "M") {
            html += `<li>🛌 <strong>Descanso Nocturno:</strong> Ve a dormir a las 22:00h para asegurar un bloque de recuperación consistente.</li>`;
        } else {
            html += `<li>🛌 Mantén tus horarios regulares de descanso en la medida en que la logística con tu esposa lo permita.</li>`;
        }
        html += `</ul>`;

        // ---- 2. LÓGICA DE CREATINA (Coadyuvante Cognitivo) ----
        html += `<div class="section-title">🧠 Suplementación Eficiente (Creatina)</div><ul>`;
        html += `<li>🥛 <strong>Dosis Fija Base (5g):</strong> Tómala por la mañana con tu primera comida familiar. La constancia celular mantiene tus depósitos llenos.</li>`;
        if (turno === "N" || turno === "TN" || turno === "24H") {
            html += `<li>🧠 <strong>Dosis Extra de Noche (3g a 5g):</strong> Tómala con la cena de las 20:00h. La evidencia (Nature, 2024) demuestra que la creatina actúa como combustible de rescate mitigando el declive de la memoria y la velocidad de reacción ante la falta de sueño severa.</li>`;
        }
        html += `</ul>`;

        // ---- 3. ENTRENAMIENTO DE FUERZA (Masa Muscular y Longevidad) ----
        html += `<div class="section-title kb-section">🏋️ Tu Bloque de Fuerza en Casa (10-15 Minutos)</div><ul>`;
        
        // Selección del entrenamiento óptimo según el cansancio de los turnos
        if (turno === "24H" || turno === "MT" || (turno === "N" && familia === "SOLO_CASA")) {
            html += `<li><strong>Estímulo de Mantenimiento Metabólico:</strong> Tu fatiga del sistema nervioso central es muy elevada hoy. Para ganar músculo sin lesionarte, haz movimientos controlados sin llegar al fallo total.
                <br>• <strong>Kettlebell Goblet Squat:</strong> 3 series x 10 repeticiones (lento al bajar).
                <br>• <strong>Remo a una mano:</strong> 3 series x 8 repeticiones por lado (apretando la espalda).
                <div class="study-note">Estudios epidemiológicos confirman que mantener solo 30-60 minutos de fuerza acumulados a la semana disminuye drásticamente el riesgo de mortalidad prematura cardiovascular. ¡Cada minuto cuenta!</div></li>`;
        } else {
            html += `<li><strong>Estímulo de Hipertrofia Sólido (Cerca del Fallo):</strong> Al tener mejores condiciones, busca máxima tensión mecánica con tu pesa de 12kg:
                <br>• <strong>Kettlebell Swings (Balanceos explosivos):</strong> 4 series x 12 repeticiones (Potencia de cadena posterior).
                <br>• <strong>Sentadilla Goblet Profunda:</strong> 4 series x 10 repeticiones (Controlando 3 segundos la bajada).
                <br>• <strong>Remo a una mano en silla:</strong> 4 series x 10 repeticiones por lado (Llegando casi a no poder hacer ninguna más).
                <div class="study-note">A los 46 años, el entrenamiento de fuerza cercano al fallo compensa la pérdida de masa muscular (sarcopenia) y reduce la incidencia de enfermedades metabólicas de forma severa según el BJSM.</div></li>`;
        }
        html += `</ul>`;

        // ---- 4. HÁBITOS BIENESTAR CAMUFLADOS ----
        html += `<div class="section-title">🌿 Bienestar Camuflado (Sol, Lectura y Mente)</div><ul>`;
        if (familia === "SOLO_CASA" || familia === "SOLO_COLE") {
            html += `<li>☀️ <strong>Deporte Exterior:</strong> Usa el trayecto a pie para llevar o recoger a los niños como tu paseo lumínico. La luz del sol bloquea tu melatonina diurna.</li>`;
            html += `<li>📚 <strong>Lectura en Micro-dosis:</strong> Lee 15 minutos en el coche o en la grada mientras esperas a que salgan de sus actividades extraescolares.</li>`;
            html += `<li>🧘 <strong>Meditación de Rescate (3 min):</strong> Siéntate solo en el coche en silencio antes de apagar el motor al llegar a casa. Respira de forma cuadrada (Inhala 4s, mantén 4s, exhala 4s, mantén 4s) para bajar el cortisol de la jornada laboral.</li>`;
        } else {
            html += `<li>☀️ <strong>Deporte Exterior:</strong> Sal a caminar de forma individual 20-30 minutos en tu ventana libre por la mañana o tarde.</li>`;
            html += `<li>📚 <strong>Lectura Consciente:</strong> Dedica 30 minutos a leer antes de tus periodos de descanso para relajar la vista.</li>`;
            html += `<li>🧘 <strong>Meditación Formal (10 min):</strong> Realiza una práctica guiada en un espacio silencioso de tu casa.</li>`;
        }
        html += `</ul>`;

        contenedor.innerHTML = html;
        output.style.display = "block";
    }
</script>

</body>
</html>
