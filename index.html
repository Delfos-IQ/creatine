<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronoBienestar MTN v3</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --primary: #2b6cb0;
            --accent: #dd6b20;
            --kettlebell: #2c5282;
            --vitd: #b7791f;
            --glucose: #9b2c2c;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 460px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        h1 { text-align: center; font-size: 21px; margin-bottom: 5px; color: #1a202c; }
        h2 { text-align: center; font-size: 13px; color: #718096; font-weight: normal; margin-top: 0; margin-bottom: 20px; }
        
        .lang-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .lang-btn {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: #fff;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .lang-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .box-question {
            background: #edf2f7;
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        label { font-weight: bold; display: block; margin-bottom: 6px; font-size: 14px; }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #fff;
            margin-bottom: 5px;
        }
        .calc-button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }
        .calc-button:hover { background-color: #234e7a; }
        
        .output-box {
            margin-top: 20px;
            display: none;
        }
        .section-title {
            font-size: 15px;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 2px solid var(--border);
            color: var(--primary);
        }
        .kb-section { color: var(--kettlebell); border-bottom: 2px solid #bee3f8; }
        .vitd-section { color: var(--vitd); border-bottom: 2px solid #feebc8; }
        .glucose-section { color: var(--glucose); border-bottom: 2px solid #fed7d7; }
        ul { padding-left: 18px; margin: 0; }
        li { margin-bottom: 10px; line-height: 1.4; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-selector">
        <button class="lang-btn active" id="btn-es" onclick="cambiarIdioma('es')">🇪🇸 Español</button>
        <button class="lang-btn" id="btn-pt" onclick="cambiarIdioma('pt')">🇵🇹 Português</button>
    </div>

    <h1 id="app-title">⏱️ Planificador Metabólico MTN</h1>
    <h2 id="app-subtitle">Control de Glucemia, Estrés e Hipertrofia</h2>

    <div class="box-question">
        <label id="lbl-turno" for="turnoSelect">💼 ¿Qué jornada laboral tienes hoy o vienes de realizar?</label>
        <select id="turnoSelect">
            <!-- Dinámico -->
        </select>
    </div>

    <div class="box-question">
        <label id="lbl-familia" for="familiaSelect">🧒 ¿Cuál es la situación con tus hijos hoy?</label>
        <select id="familiaSelect">
            <!-- Dinámico -->
        </select>
    </div>

    <button class="calc-button" id="btn-calc" onclick="generarPlanCompleto()">⚡ Calcular mi Plan de Hoy</button>

    <div id="output" class="output-box">
        <div id="dinamicoContenido"></div>
    </div>
</div>

<script>
    let idiomaActual = 'es';

    const traducciones = {
        es: {
            title: "⏱️ Planificador Metabólico MTN",
            subtitle: "Control de Glucemia, Estrés e Hipertrofia | Perfil Familiar",
            lblTurno: "💼 ¿Qué jornada laboral tienes hoy o vienes de realizar?",
            lblFamilia: "🧒 ¿Cuál es la situación con tus hijos hoy?",
            btnCalc: "⚡ Calcular mi Plan de Hoy",
            resTitulo: "📋 Tu Estrategia Personalizada de Hoy",
            turnos: [
                {v: "M", t: "Turno M (Mañana)"},
                {v: "T", t: "Turno T (Tarde)"},
                {v: "ENTRA_N", t: "Día que ENTRAS de Noche (Noche 1)"},
                {v: "ENTRE_N", t: "Día ENTRE Noches (Noches seguidas)"},
                {v: "SALIENTE_N", t: "Saliente de Turno N (Última noche)"},
                {v: "MT", t: "Doblando Turno (M + T)"},
                {v: "TN", t: "Doblando Turno (T + N)"},
                {v: "SALIENTE_24H", t: "Saliente de Guardia de 24 Horas"},
                {v: "LIBRE", t: "Día Libre / Descanso Puro"}
            ],
            familia: [
                {v: "APOYO", t: "Tengo apoyo (Cónyuge en casa / Niños en escuela)"},
                {v: "SOLO_COLE", t: "Solo con peques, pero van a la escuela/extraescolares"},
                {v: "SOLO_CASA", t: "Solo con peques atrapados en casa (No duermo / Logística total)"}
            ],
            secGlucosa: "🩸 Escudo Anti-Atracones y Nutrición",
            secVitD: "☀️ Protocolo Vitamina D (Masa Muscular)",
            secCreatina: "🧠 Suplementación (Creatina Monohidrato)",
            secKettlebell: "🏋️ Tu Estímulo Kettlebell en Casa (12kg)",
            secSueno: "🌿 Siestas, Logística y Descanso Realista"
        },
        pt: {
            title: "⏱️ Planeador Metabólico MTN",
            subtitle: "Controlo de Glicémia, Stress e Hipertrofia | Perfil Familiar",
            lblTurno: "💼 Que jornada de trabalho tens hoje ou acabaste de fazer?",
            lblFamilia: "🧒 Qual é a situação com os miúdos hoje?",
            btnCalc: "⚡ Calcular o meu Plano de Hoje",
            resTitulo: "📋 Tua Estratégia Personalizada de Hoje",
            turnos: [
                {v: "M", t: "Turno M (Manhã)"},
                {v: "T", t: "Turno T (Tarde)"},
                {v: "ENTRA_N", t: "Dia em que ENTRAS de Noite (Noite 1)"},
                {v: "ENTRE_N", t: "Dia ENTRE Noites (Noites consecutivas)"},
                {v: "SALIENTE_N", t: "Sair do Turno N (Última noite)"},
                {v: "MT", t: "Turno Duplo (M + T)"},
                {v: "TN", t: "Turno Duplo (T + N)"},
                {v: "SALIENTE_24H", t: "Sair de Banco / Piquete de 24 Horas"},
                {v: "LIBRE", t: "Dia de Folga / Descanso Puro"}
            ],
            familia: [
                {v: "APOYO", t: "Tenho apoio (Cônjuge em casa / Miúdos na escola)"},
                {v: "SOLO_COLE", t: "Sozinho com os miúdos, mas vão à escola/atividades"},
                {v: "SOLO_CASA", t: "Sozinho com os miúdos em casa (Sem dormir / Logística total)"}
            ],
            secGlucosa: "🩸 Escudo Anti-Compulsão e Nutrição",
            secVitD: "☀️ Protocolo Vitamina D (Massa Muscular)",
            secCreatina: "🧠 Suplementação (Creatina Monohidrato)",
            secKettlebell: "🏋️ Teu Estímulo Kettlebell en Casa (12kg)",
            secSueno: "🌿 Sestas, Logística e Descanso Realista"
        }
    };

    function cambiarIdioma(lang) {
        idiomaActual = lang;
        document.getElementById('btn-es').classList.toggle('active', lang === 'es');
        document.getElementById('btn-pt').classList.toggle('active', lang === 'pt');
        
        document.getElementById('app-title').innerText = traducciones[lang].title;
        document.getElementById('app-subtitle').innerText = traducciones[lang].subtitle;
        document.getElementById('lbl-turno').innerText = traducciones[lang].lblTurno;
        document.getElementById('lbl-familia').innerText = traducciones[lang].lblFamilia;
        document.getElementById('btn-calc').innerText = traducciones[lang].btnCalc;
        
        const tSel = document.getElementById('turnoSelect');
        const tVal = tSel.value;
        tSel.innerHTML = traducciones[lang].turnos.map(o => `<option value="${o.v}">${o.t}</option>`).join('');
        if(tVal) tSel.value = tVal;

        const fSel = document.getElementById('familiaSelect');
        const fVal = fSel.value;
        fSel.innerHTML = traducciones[lang].familia.map(o => `<option value="${o.v}">${o.t}</option>`).join('');
        if(fVal) fSel.value = fVal;

        document.getElementById('output').style.display = "none";
    }

    function generarPlanCompleto() {
        const turno = document.getElementById('turnoSelect').value;
        const familia = document.getElementById('familiaSelect').value;
        const output = document.getElementById('output');
        const contenedor = document.getElementById('dinamicoContenido');
        const t = traducciones[idiomaActual];
        
        let html = `<h2>${t.resTitulo}</h2>`;
        
        // ---- 1. NUTRICIÓN Y GLUCEMIA ----
        html += `<div class="section-title glucose-section">${t.secGlucosa}</div><ul>`;
        if (["SALIENTE_N", "SALIENTE_24H", "ENTRE_N"].includes(turno)) {
            if(idiomaActual === 'es') {
                html += `<li>🥪 <strong>Bocadillo de Rescate (Pan 40-50g + Tortilla/Caballa/Sardinas):</strong> Excelente opción. Da siempre el primer bocado a la proteína/pescado antes de morder el pan. Así el estómago asimila las grasas y reduce el impacto de la insulina del pan blanco.</li>`;
                html += `<li>🥛 <strong>Bebida vegetal alternativa:</strong> Evita la bebida de avena líquida pura antes de dormir. Usa soja o almendras sin azúcar con tu clara de huevo en polvo para mantener estable la hormona del crecimiento mientras duermes.</li>`;
            } else {
                html += `<li>🥪 <strong>Sandes de Resgate (Pão 40-50g + Omelete/Cavala/Sardinhas):</strong> Excelente opção. Dá sempre a primeira trinca na proteína/peixe antes de morder o pão. Assim achatas o pico de insulina.</li>`;
                html += `<li>🥛 <strong>Bebida vegetal alternativa:</strong> Evita a bebida de aveia líquida pura antes de dormir. Usa soja ou amêndoa sem açúcar com a tua clara de ovo para proteger a massa muscular.</li>`;
            }
        } else {
            html += `<li>${idiomaActual === 'es' ? '🥗 <strong>Orden metabólico:</strong> Come primero las verduras, luego las proteínas y deja los carbohidratos para el final.' : '🥗 <strong>Ordem metabólica:</strong> Come primeiro os vegetais, depois as proteínas e deixa os hidratos para o fim.'}</li>`;
        }
        html += `</ul>`;

        // ---- 2. VITAMINA D ----
        html += `<div class="section-title vitd-section">${t.secVitD}</div><ul>`;
        html += `<li>💊 ${idiomaActual === 'es' ? '<strong>Con comida grasa:</strong> Tómala junto a las sardinas o caballa para optimizar su absorción y combatir la barriga de estrés.' : '<strong>Com comida gorda:</strong> Toma com as sardinhas ou cavala para otimizar a absorção e reduzir a gordura abdominal.'}</li>`;
        html += `</ul>`;

        // ---- 3. CREATINA ----
        html += `<div class="section-title">${t.secCreatina}</div><ul>`;
        html += `<li>🥛 ${idiomaActual === 'es' ? '<strong>Dosis fija diaria (5g):</strong> Con la primera comida por la mañana.' : '<strong>Dose fixa diária (5g):</strong> Com a primeira refeição da manhã.'}</li>`;
        if (["ENTRA_N", "ENTRE_N", "TN"].includes(turno)) {
            html += `<li>🧠 ${idiomaActual === 'es' ? '<strong>Escudo nocturno:</strong> Toma de 3g a 5g adicionales con la cena previa a la noche. Funciona como combustible de reserva cerebral ante el desvelo.' : '<strong>Escudo noturno:</strong> Toma 3g a 5g adicionais no jantar prévio. Funciona como combustível cerebral contra a privação de sono.'}</li>`;
        }
        html += `</ul>`;

        // ---- 4. KETTLEBELL ----
        html += `<div class="section-title kb-section">${t.secKettlebell}</div><ul>`;
        if (["SALIENTE_24H", "MT", "ENTRE_N"].includes(turno) || (turno === "ENTRA_N" && familia === "SOLO_CASA")) {
            if(idiomaActual === 'es') {
                html += `<li><strong>Rutina Corta de Vaciado (10-15 min libres):</strong> El sistema nervioso está cansado. Haz Swings intensos pero controlados (3 series x 15) y zancadas. Usa el ejercicio como una esponja metabólica para absorber los azúcares en sangre de los atracones.</li>`;
            } else {
                html += `<li><strong>Rotina Curta de Esvaziamento (10-15 min livres):</strong> O sistema nervoso está cansado. Faz Swings controlados (3 séries x 15) e passadas. Redireciona a energia para o músculo.</li>`;
            }
        } else {
            if(idiomaActual === 'es') {
                html += `<li><strong>Rutina de Hipertrofia (Cerca del Fallo):</strong> Tienes energía disponible. 4 series de Swings x 12, Sentadillas Goblet x 10 y Remos pesados x 10 por lado para combatir la sarcopenia a los 46 años.</li>`;
            } else {
                html += `<li><strong>Rotina de Hipertrofia (Perto do Falho):</strong> Tens energia. 4 séries de Swings x 12, Agachamentos Goblet x 10 e Remo pesado x 10 por lado para ganhar massa muscular.</li>`;
            }
        }
        html += `</ul>`;

        // ---- 5. SIESTAS Y SUEÑO ----
        html += `<div class="section-title">${t.secSueno}</div><ul>`;
        
        if (turno === "ENTRA_N") {
            if (familia === "APOYO") {
                html += `<li>💤 ${idiomaActual === 'es' ? '<strong>Siesta Profiláctica Completa (90 min):</strong> Duerme por la tarde un ciclo de sueño completo antes de entrar para descargar la adenosina celular.' : '<strong>Sesta Profilática Completa (90 min):</strong> Dorme à tarde um ciclo completo antes de entrar para limpar a adenosina.'}</li>`;
            } else if (familia === "SOLO_COLE") {
                html += `<li>💤 ${idiomaActual === 'es' ? '<strong>Powernap de Rescate (20-30 min):</strong> Aprovecha la tarde mientras los niños hacen deberes o están en extraescolares para dar una cabezada en el sofá.' : '<strong>Powernap de Resgate (20-30 min):</strong> Aproveita a tarde enquanto os miúdos fazem os trabalhos ou estão nas atividades para fechar os olhos no sofá.'}</li>`;
            } else {
                html += `<li>⚠️ ${idiomaActual === 'es' ? '<strong>Sin siesta hoy (Solo con niños en casa):</strong> No duermes por la tarde. El cansancio de madrugada será severo; mantente activo, usa agua fría e hidratación constante durante el turno.' : '<strong>Sem sesta hoje (Sozinho em casa):</strong> Não consegues dormir à tarde. O cansaço de madrugada será severo; mantém-te ativo e hidratado.'}</li>`;
            }
        } else if (turno === "ENTRE_N") {
            html += `<li>🛌 ${idiomaActual === 'es' ? '<strong>Bloque Sagrado de Mañana:</strong> Vienes de trabajar. Duerme de 08:00h a 13:00h de forma prioritaria en oscuridad absoluta mientras los niños están en el colegio.' : '<strong>Bloco Sagrado da Manhã:</strong> Vens de trabalhar. Dorme das 08:00h às 13:00h em escuridão absoluta enquanto os miúdos estão na escola.'}</li>`;
        } else if (turno === "SALIENTE_N" || turno === "SALIENTE_24H") {
            html += `<li>🛌 ${idiomaActual === 'es' ? '<strong>Sueño de Recuperación de Mañana:</strong> Duerme un bloque sólido al llegar. Por la tarde, realiza un paseo lumínico al aire libre para avisar a tu cerebro de que ya es de día.' : '<strong>Sono de Recuperação da Manhã:</strong> Dorme um bloco sólido ao chegar. À tarde, faz um passeio sob o sol para reajustar o cérebro.'}</li>`;
        } else {
            html += `<li>🌿 ${idiomaActual === 'es' ? 'Mantén la higiene de sueño habitual y acuéstate temprano los días M o libres.' : 'Mantém a higiene de sono habitual e deita-te cedo nos dias M ou de folga.'}</li>`;
        }
        html += `</ul>`;

        contenedor.innerHTML = html;
        output.style.display = "block";
    }

    window.onload = function() {
        cambiarIdioma('es');
    };
</script>

</body>
</html>
